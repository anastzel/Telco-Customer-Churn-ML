name: Test and publish Docker image

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependencies and run tests
        run: |
          python -m pip check
          python -m pytest tests/ -q

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image for verification
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: telco-churn:ci
      - name: Check container startup and inference
        run: |
          docker run -d --name telco-ci -p 8000:8000 telco-churn:ci
          trap 'docker logs telco-ci; docker rm -f telco-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/ >/dev/null
          curl -fsS -X POST http://127.0.0.1:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"gender":"Female","Partner":"No","Dependents":"No","PhoneService":"Yes","MultipleLines":"No","InternetService":"Fiber optic","OnlineSecurity":"No","OnlineBackup":"No","DeviceProtection":"No","TechSupport":"No","StreamingTV":"Yes","StreamingMovies":"Yes","Contract":"Month-to-month","PaperlessBilling":"Yes","PaymentMethod":"Electronic check","SeniorCitizen":0,"tenure":1,"MonthlyCharges":85.0,"TotalCharges":85.0}' \
            | python -c 'import json,sys; assert json.load(sys.stdin)["prediction"] in ("Likely to churn", "Not likely to churn")'
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish verified image
        if: github.event_name == 'push'
        run: |
          docker tag telco-churn:ci anastzel/telco-fastapi:${GITHUB_SHA}
          docker tag telco-churn:ci anastzel/telco-fastapi:latest
          docker push anastzel/telco-fastapi:${GITHUB_SHA}
          docker push anastzel/telco-fastapi:latest
